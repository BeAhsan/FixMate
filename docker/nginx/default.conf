server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 32M;

    # Container logs: let the Docker log driver collect them.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The health endpoint is polled by Docker and the CI smoke test.
    location = /up {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny dotfiles (except well-known) and anything that is not PHP in public/.
    location ~ /\.(?!well-known).* { deny all; }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        # Vite fingerprints these filenames, so they are safe to cache forever.
        # `expires` only understands time units like 30d, not "6mo".
        expires 180d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }
}
