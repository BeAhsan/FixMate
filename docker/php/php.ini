; Production PHP settings for the FPM runtime.
; Loaded from /usr/local/etc/php/conf.d/zz-app.ini

expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_vars = 5000
date.timezone = UTC

; The image is immutable and replaced per release, so revalidation is wasted work.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 5
opcache.validate_timestamps = 0
opcache.save_comments = 1
