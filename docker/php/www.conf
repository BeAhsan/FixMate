; Replaces the image's default www pool.
; nginx runs in the same container, so FastCGI stays on loopback and is never exposed.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers to bound the impact of any per-request memory leak.
pm.max_requests = 500

; Keep the environment so Laravel can read .env injected by the platform.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
