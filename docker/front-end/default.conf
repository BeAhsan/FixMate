# nginx configuration for a front-end static export.
#
# Shared by all four front-end images rather than copied into each
# application's directory. This file is the server, and the server is the same
# for all four: a directory of files, served as files. What differs between the
# four is the Dockerfile that builds the export and the port compose publishes
# it on, neither of which belongs in a server configuration.
#
# The application is a client, so there is nothing to proxy and no upstream. The
# back end is reached from the browser, not from here.

server {
    listen 80 default_server;
    server_name _;

    # Written by the Dockerfile to the only directory in the image that holds
    # application output. There is no source tree above it to fall back to.
    root /var/www/html;
    index index.html;
    charset utf-8;

    # Container logs: let the Docker log driver collect them.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # `$uri/` before `$uri/index.html` is deliberate. The export is built with
    # `trailingSlash: true`, so a route is a directory containing an index.html
    # rather than a sibling .html file, and `$uri/` lets nginx serve that index
    # itself. The trailing `$uri/index.html` is what answers a request for a
    # path with no directory on disk, which is what a client-side route looks
    # like by the time a person reaches it by typing or by following a link.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Polled by Docker, by the deploy script and by the pipeline's smoke check,
    # exactly as `/up` is for the API image. `= /up` is an exact-match location,
    # so it is answered from the filesystem like any other path and needs no
    # separate rule beyond being excluded from the access log.
    location = /up {
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # `^~`, and the modifier is load-bearing. Without it nginx evaluates the
    # regex locations below first, `/_next/static/chunks/app.css` matches
    # `\.css$`, and this block never runs - so the fingerprinted files, the only
    # ones safe to cache forever, got the seven-day rule written for everything
    # else. `^~` stops regex matching for anything under this prefix.
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else the export writes. Not fingerprinted - a new release
    # writes the same /index.html - so this is a week, revalidated, and no
    # `immutable`.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Nothing above /var/www/html exists in the image, so a dotfile request is a
    # probe rather than a file. Denied rather than 404'd to keep the answer
    # identical either way.
    location ~ /\. {
        deny all;
    }
}
