# Pull-request gate. Deliberately a mirror of the Jenkins Verify and Test
# stages, not a third opinion: same PHP version as the runtime image
# (Dockerfile ARG PHP_VERSION), same Pint check, same suite.
#
# It does NOT build or push the image. Jenkins owns that, and it pushes
# straight to ghcr.io from the controller, so a duplicate build here would
# only publish a tag nothing deploys.
#
# Tests run against in-memory SQLite (phpunit.xml), so no MySQL or Redis
# service is needed.

name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        # Must match Dockerfile ARG PHP_VERSION. composer.json only requires
        # ^8.3, so the skeleton default of 8.0 fails the platform check
        # before a single test runs.
        php-version: '8.4'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Check code style
      # Before the tests, and the same gate the Jenkins Verify stage applies.
      # Run this locally too, or CI is the first place it is found.
      run: vendor/bin/pint --test
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      run: php artisan test
