# Pull-request gate. Deliberately a mirror of the Jenkins Verify, Test and Front
# end stages, not a third opinion: same PHP version as the runtime image
# (Dockerfile ARG PHP_VERSION), same Pint check, same suite, and the same
# type-check, test and build for the four front ends.
#
# It does NOT build or push the image. Jenkins owns that, and it pushes
# straight to ghcr.io from the controller, so a duplicate build here would
# only publish a tag nothing deploys.
#
# Tests run against in-memory SQLite (phpunit.xml), so no MySQL or Redis
# service is needed. The front-end job needs no service either: the four
# applications are static exports and the only address involved is a build-time
# fallback.

name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        # Must match Dockerfile ARG PHP_VERSION. composer.json only requires
        # ^8.3, so the skeleton default of 8.0 fails the platform check
        # before a single test runs.
        php-version: '8.4'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Check code style
      # Before the tests, and the same gate the Jenkins Verify stage applies.
      # Run this locally too, or CI is the first place it is found.
      run: vendor/bin/pint --test
    - name: Check the generated client still matches the front ends
      # The drift check, run as its own step so a renamed route says so rather
      # than surfacing as a failing test three files away. The same command is
      # in the Jenkins Test stage, and the suite asserts it too.
      run: php artisan api-client:check
    - name: Check the OpenAPI document still describes the API
      # A second drift check, and separate because it asks a different question:
      # whether the document a reader and any OpenAPI tooling consume is still
      # true. The one above cannot tell — the contract has no field for a
      # security requirement. Mirrored in the Jenkins Test stage.
      run: php artisan api-docs:check
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      run: php artisan test

  # The four front ends. A separate job rather than more steps above, so a
  # front-end failure is reported as a front-end failure instead of arriving as
  # one more red step in a job named for PHP.
  #
  # It needs PHP as well as Node, which looks redundant and is not: the typed
  # client is generated by `php artisan api-client:generate` and is never
  # committed, so nothing in the front end can typecheck or build without it.
  # This is the "throwaway PHP container, then the front ends" arrangement the
  # spec describes, and it is why the job is not Node-only.
  front-end:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        # Must match Dockerfile ARG PHP_VERSION and the job above. A different
        # version here would mean the drift check and the build disagree about
        # what the API looks like.
        php-version: '8.4'
    - uses: actions/setup-node@v4
      with:
        # Must match the `engines.node` field in the root package.json.
        node-version: '22'
        cache: 'npm'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install PHP dependencies
      # No dev flag: `api-client:generate` is served by laravel/wayfinder, which
      # is a require-dev dependency, so --no-dev would remove the command this
      # job exists to run before it.
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate the typed client
      # Before npm anything, because every front end imports
      # @fixmate/api-client and it re-exports operations that import from
      # src/generated. Mirrored in the Jenkins Front end stage.
      run: php artisan api-client:generate
    - name: Install node dependencies
      run: npm ci
    - name: Type-check every workspace member
      run: npm run typecheck
    - name: Test every workspace member
      run: npm test
    - name: Build every application
      # `npm run build --workspaces`, and deliberately not the root
      # `npm run build`. The root script begins with `php artisan
      # api-client:generate`, which is why generation is the explicit step above
      # rather than part of the build — it needs PHP and the build needs Node, and
      # the Jenkins stage runs them in separate containers. The root command stays
      # the right one for a developer on a host, where both are installed.
      #
      # This builds all four front ends, and it does not pass --if-present: a
      # member without a build script fails this rather than being skipped,
      # because a front end that silently does not build is a front end nobody
      # notices is broken.
      #
      # NEXT_PUBLIC_API_URL is deliberately not set. The back end's address is
      # inlined into each export, and the application falls back to the local
      # address when the variable is absent — so the build needs no secret and no
      # running service. A *blank* value is what fails the build, and nothing here
      # sets one.
      run: npm run build --workspaces
